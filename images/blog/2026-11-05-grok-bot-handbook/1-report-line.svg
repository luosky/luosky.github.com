ht="142" rx="12" fill="#EFE9DD"/><g transform="translate(28 554)" opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.174;0.184;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="30s" begin="0s" repeatCount="indefinite" calcMode="spline"/><text x="0" y="0" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', serif" font-size="30" font-weight="400" fill="#C2412D" text-anchor="start">1　渠道 bot：有事先报给 leader</text><text x="0" y="44" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">不直接来找我，</text><text x="0" y="82" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">先向 leader 反馈。</text></g><g transform="translate(28 554)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.194;0.204;0.368;0.378;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="30s" begin="0s" repeatCount="indefinite" calcMode="spline"/><text x="0" y="0" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', serif" font-size="30" font-weight="400" fill="#C2412D" text-anchor="start">2　leader：运营上的事它拍板</text><text x="0" y="44" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">运营决定大部分授权给 leader，</text><text x="0" y="82" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">小事在这一层就消化了。</text></g><g transform="translate(28 554)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.388;0.398;0.562;0.572;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="30s" begin="0s" repeatCount="indefinite" calcMode="spline"/><text x="0" y="0" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', serif" font-size="30" font-weight="400" fill="#C2412D" text-anchor="start">3　我：只拍核心决策</text><text x="0" y="44" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">产品和隐私方向，对外发布、</text><text x="0" y="82" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">花钱、删除这类不可逆的事。</text></g><g transform="translate(28 554)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.582;0.592;0.756;0.766;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="30s" begin="0s" repeatCount="indefinite" calcMode="spline"/><text x="0" y="0" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', serif" font-size="30" font-weight="400" fill="#C2412D" text-anchor="start">4　leader：先筛一遍再给我</text><text x="0" y="44" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">要我拍板的事，它先筛选、</text><text x="0" y="82" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">整理一遍，再交到我手上。</text></g><g transform="translate(28 554)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.776;0.786;0.97;0.98;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="30s" begin="0s" repeatCount="indefinite" calcMode="spline"/><text x="0" y="0" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', serif" font-size="30" font-weight="400" fill="#C2412D" text-anchor="start">5　新 bot：先读员工手册</text><text x="0" y="44" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">新来的 bot 先读 leader 整理的手册，</text><text x="0" y="82" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">不用我从头交代一遍。</text></g></svg>
