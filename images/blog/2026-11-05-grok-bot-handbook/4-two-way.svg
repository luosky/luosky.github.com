ub 上派活</text></g><g transform="translate(180 480)"><rect width="280" height="84" rx="10" fill="#FFFDF8" stroke="#CFC7B8"/><text x="140" y="36" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="600" fill="#1F1D1A" text-anchor="middle">开发 AI</text><text x="140" y="68" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="400" fill="#7A746A" text-anchor="middle">Claude 写，Codex 审</text></g><g transform="translate(180 608)"><rect width="280" height="84" rx="10" fill="#FFFDF8" stroke="#CFC7B8"/><text x="140" y="36" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="600" fill="#1F1D1A" text-anchor="middle">负责人</text><text x="140" y="68" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="24" font-weight="400" fill="#7A746A" text-anchor="middle">最后点合并</text></g><rect x="174" y="90" width="292" height="224" rx="12" fill="none" stroke="#C2412D" stroke-width="3"><animate attributeName="x" values="174;174;174;174;174;174;174;174;174;174;174;174;174" keyTimes="0;0.1417;0.1617;0.3033;0.3233;0.465;0.485;0.6267;0.6467;0.7883;0.8083;0.97;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="30s" begin="0s" repeatCount="indefinite" calcMode="spline"/><animate attributeName="y" values="90;90;218;218;474;474;218;218;90;90;474;474;90" keyTimes="0;0.1417;0.1617;0.3033;0.3233;0.465;0.485;0.6267;0.6467;0.7883;0.8083;0.97;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="30s" begin="0s" repeatCount="indefinite" calcMode="spline"/><animate attributeName="width" values="292;292;292;292;292;292;292;292;292;292;292;292;292" keyTimes="0;0.1417;0.1617;0.3033;