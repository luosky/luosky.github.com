412D" text-anchor="start">2　提需求 bot：在 GitHub 开 issue</text><text x="0" y="44" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">issue 打上派活标签，</text><text x="0" y="82" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">cavil-loop 看到就派给开发 AI。</text></g><g transform="translate(28 762)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3233;0.3333;0.465;0.475;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="30s" begin="0s" repeatCount="indefinite" calcMode="spline"/><text x="0" y="0" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', serif" font-size="30" font-weight="400" fill="#C2412D" text-anchor="start">3　开发 AI：先出方案，再写代码</text><text x="0" y="44" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">Claude 出方案、写代码，</text><text x="0" y="82" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">方案和代码都由 Codex 复审。</text></g><g transform="translate(28 762)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.485;0.495;0.6267;0.6367;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="30s" begin="0s" repeatCount="indefinite" calcMode="spline"/><text x="0" y="0" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', serif" font-size="30" font-weight="400" fill="#C2412D" text-anchor="start">4　开发要文案：反过来找运营</text><text x="0" y="44" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">开发 AI 在评论里写清要什么，</text><text x="0" y="82" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">cavil-loop 叫醒提需求 bot。</text></g><g transform="translate(28 762)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6467;0.6567;0.7883;0.7983;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="30s" begin="0s" repeatCount="indefinite" calcMode="spline"/><text x="0" y="0" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', serif" font-size="30" font-weight="400" fill="#C2412D" text-anchor="start">5　提需求 bot：转给运营，再贴回</text><text x="0" y="44" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">运营给出文案或案例，</text><text x="0" y="82" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">提需求 bot 把答复贴回 GitHub。</text></g><g transform="translate(28 762)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8083;0.8183;0.97;0.98;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="30s" begin="0s" repeatCount="indefinite" calcMode="spline"/><text x="0" y="0" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', serif" font-size="30" font-weight="400" fill="#C2412D" text-anchor="start">6　做完：运营过目，负责人合并</text><text x="0" y="44" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">PR 先经提需求 bot 给运营看，</text><text x="0" y="82" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="28" font-weight="400" fill="#1F1D1A" text-anchor="start">认可后由负责人合并上线。</text></g></svg>
